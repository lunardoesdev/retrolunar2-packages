version = "2.0.8"

build = """
mkdir -p dl
if [ ! -f dl/glad.tar.gz ]; then
  curl -fSL -C - -o dl/glad.tar.gz \"https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.8.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/glad.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
