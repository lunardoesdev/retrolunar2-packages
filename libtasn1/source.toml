# The library that turns DER/BER into a tree and back: libtasn1.a and its one
# public header. 4.21.0 is the newest release on ftp.gnu.org/gnu/libtasn1
# (libtasn1-4.21.0.tar.gz, 2026-01-08) and its lib/libtasn1.pc says 4.21.0.
#
# The release tarball ships a generated ./configure (its second line says
# "Generated by GNU Autoconf 2.72 for GNU Libtasn1 4.21.0"), together with
# aclocal.m4, Makefile.in and the generated parser lib/ASN1.c - which is
# load-bearing rather than convenient, because these systems carry no autotools
# on purpose and no bison is installed on the host either. ASN1.c and ASN1.y
# carry the same mtime in the tarball, so make never regenerates the parser.
#
# One leading directory (libtasn1-4.21.0/), so --strip-components=1 like the
# other release-tarball recipes here.
version = "4.21.0"

build = """
mkdir -p dl
if [ ! -f dl/libtasn1.tar.gz ]; then
  curl -fSL -C - -o dl/libtasn1.tar.gz \"https://ftp.gnu.org/gnu/libtasn1/libtasn1-4.21.0.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/libtasn1.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
