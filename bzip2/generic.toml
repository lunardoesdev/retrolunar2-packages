deps = ["bzip2@source"]
buildsystem = "make"
make = false
install = false
post = """
# Build the target utilities directly; the default target runs tests.
make -j\"$CORES\" CC=\"$CC\" AR=\"$AR\" RANLIB=\"$RANLIB\" CFLAGS=\"$CFLAGS\" LDFLAGS=\"$LDFLAGS\" bzip2 bzip2recover
# The Windows driver appends .exe to whatever -o names (upstream
# Makefile:41 and :44 say `-o bzip2`), so the two link steps above
# produce bzip2.exe and bzip2recover.exe. The install target then
# hardcodes the bare names — `cp -f bzip2 $(PREFIX)/bin/bzip2` at
# :77-80 — and this Makefile has no EXEEXT variable at all, so there
# is nothing to set: the install dies with \"cannot stat 'bzip2'\".
#
# Upstream ships no configure here either, so EXEEXT cannot be
# injected the way it normally would be. Copying the two files onto
# the names the install rule looks for keeps `make install` as the
# single source of truth for what gets installed; reimplementing its
# ~30 lines in the recipe would let the two drift apart.
# Only a PE target appends .exe. An ELF link written as `-o bzip2`
# (upstream Makefile:44) produces `bzip2`, with no `bzip2.exe` beside
# it, so an unconditional copy is what stopped every non-mingw build of
# this package -
#   cp: cannot stat 'bzip2.exe': No such file or directory
# (aarch64-android33, as ffmpeg's bzlib dependency) - and `make install`
# then found no `bzip2` to install either. Copy only when the suffixed
# name is actually there, so both families reach the install target.
for _b in bzip2 bzip2recover; do
  [ -f \"$_b.exe\" ] && cp \"$_b.exe\" \"$_b\"
done
# The prefix handed to install is the *staged* one, not $OUTPKG: bzip2
# has no DESTDIR support at all, its install rule copies into
# $(PREFIX)/bin, $(PREFIX)/lib, $(PREFIX)/man and $(PREFIX)/include
# itself, so this argument *is* the destination a copy is written to.
# Given $OUTPKG it wrote straight into the published path, the staged
# tree was never created, and the publish step then reported
#   sh: line 50: <stage>/.../store/<hash>/../.relax-list: No such file or directory
# (its own relax step, with nothing staged to relax) before publishing an
# empty entry - publishing is rm -rf the entry and mkdir it again when
# there is no staged tree to move. DESTDIR is exported and bzip2 ignores
# it, which is why the path has to be right in the argument.
make -j\"$CORES\" CC=\"$CC\" AR=\"$AR\" RANLIB=\"$RANLIB\" CFLAGS=\"$CFLAGS\" LDFLAGS=\"$LDFLAGS\" PREFIX=\"$PREFIX\" install
"""
