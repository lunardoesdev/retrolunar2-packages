# help2man 1.49.3, the newest release on ftp.gnu.org/gnu/help2man. It is a
# tool, not a library: what it produces is the `help2man` script, its shipped
# man page and info manual, and the translations (off, see generic.toml).
#
# The tarball ships a generated ./configure ("Generated by GNU Autoconf 2.71
# for GNU help2man 1.49.3") together with Makefile.in, so no autotools is
# needed at build time, which is what makes it usable in these systems.
#
# One leading directory (help2man-1.49.3/), so --strip-components=1 like the
# other release-tarball recipes here. It is an .tar.xz, and tar -xf reads it
# without an explicit -J.
version = "1.49.3"

build = """
mkdir -p dl
if [ ! -f dl/help2man.tar.xz ]; then
  curl -fSL -C - -o dl/help2man.tar.xz \"https://ftp.gnu.org/gnu/help2man/help2man-1.49.3.tar.xz\"
fi
rm -rf src
mkdir -p src
tar -xf dl/help2man.tar.xz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
