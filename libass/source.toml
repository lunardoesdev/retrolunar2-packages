# libass publishes its releases on the GitHub releases page as
# libass-<version>.tar.gz, and the release tarballs ship a generated
# ./configure (the file says "Generated by GNU Autoconf 2.72 for libass
# 0.17.5" on its second line), so no autotools step is needed here. That is
# load-bearing rather than convenient: these systems carry no autotools on
# purpose, so a tarball without a generated ./configure - a git checkout, or
# upstream's own `make dist` output if it ever stops shipping one - could not
# be built by this package at all, and the fix would be to take the release
# tarball rather than to add autoreconf to the build.
#
# The tarball's one leading directory is libass-0.17.5/, so it unpacks with
# --strip-components=1 like the other recipes here. 0.17.5 is the newest
# release and is what RELEASEVERSION in the tarball says.
version = "0.17.5"

build = """
mkdir -p dl
if [ ! -f dl/libass.tar.gz ]; then
  curl -fSL -C - -o dl/libass.tar.gz \"https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/libass.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
