version = "1.2.1"

build = """
mkdir -p dl
if [ ! -f dl/speexdsp.tar.gz ]; then
  curl -fSL -C - -o dl/speexdsp.tar.gz \"https://deb.debian.org/debian/pool/main/s/speexdsp/speexdsp_1.2.1.orig.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/speexdsp.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
