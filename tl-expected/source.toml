version = "1.3.1"

build = """
mkdir -p dl
if [ ! -f dl/tl-expected.tar.gz ]; then
  curl -fSL -C - -o dl/tl-expected.tar.gz \"https://github.com/TartanLlama/expected/archive/refs/tags/v1.3.1.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/tl-expected.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
