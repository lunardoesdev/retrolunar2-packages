deps = ["help2man@native", "texinfo@source"]
buildsystem = "make"
# help2man is what builds this package's man pages: Makefile.am gives
# man/makeinfo.1 a `$(HELP2MAN) --output=... --no-info ./makeinfo` rule, and
# without it the build stops with `help2man: command not found`
#   make[2]: *** [Makefile:2188: makeinfo.1] Error 127
#
# The program is named through $help2man_PREFIX in `pre` below: env.c:124-145
# puts a dependency's bin directory on PATH only when the dependency lives in
# *another* system ("another system: a host tool ... contributes runnable
# programs"). A dependency in the recipe's own system is a link-time dependency
# and contributes include/lib/pkgconfig entries, never a bin directory. This is
# a native build, so help2man is its own system and the bin directory has to go
# on PATH here. The variable the emitter writes for a same-system dependency is
# `help2man_PREFIX` (env.c:183, no _HOST suffix), and `pre` runs after those
# assignments, so it is in scope there.
#
# Texinfo cross-builds native helpers; use host tools before the NDK in nested configures.
# Keep nested config.status newer to prevent make from reconfiguring native helpers.
pre = """
PATH="/usr/bin:/bin:$help2man_PREFIX/bin:$PATH"
BUILD_CC=/usr/bin/cc BUILD_AR=/usr/bin/ar BUILD_RANLIB=/usr/bin/ranlib ./configure $AUTOCONF_CONFIGURE_FLAGS
touch aclocal.m4 configure config.h.in
find . -name 'Makefile.in' | xargs touch
find . -name config.status | xargs touch
"""
