# leptonica's releases are GitHub release assets, and the asset is a real
# dist tarball rather than a git archive: leptonica-1.87.0.tar.gz ships a
# generated ./configure, aclocal.m4, Makefile.in, config/ltmain.sh and the
# m4/libtool*.m4 set (upstream publishes `make dist` output - "Generated by
# GNU Autoconf 2.72 for leptonica 1.87.0" is on the configure script's second
# line). So no autotools step is needed here, which is load-bearing: these
# systems carry no autotools on purpose, and a git-archive source - a bare tag
# archive, or upstream's tree without the dist step - could not be built by
# this package at all.
#
# The asset name carries the bare version (leptonica-1.87.0.tar.gz), with no
# "v" prefix as on the tag, and the tarball has one leading directory
# (leptonica-1.87.0/), so it unpacks with --strip-components=1 like the other
# release-tarball recipes here.
version = "1.87.0"

build = """
mkdir -p dl
if [ ! -f dl/leptonica.tar.gz ]; then
  curl -fSL -C - -o dl/leptonica.tar.gz \"https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/leptonica.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
