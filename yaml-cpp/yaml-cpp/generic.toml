deps = ["yaml-cpp@source"]
buildsystem = "cmake"
# Static library, headers, pkg-config file and the C++ ABI toggle.
# Tests, tools and utilities are host programs and stay off.
args = ["-DYAML_CPP_BUILD_TESTS=OFF", "-DYAML_CPP_BUILD_TOOLS=OFF", "-DYAML_CPP_BUILD_UTILS=OFF", "-DYAML_BUILD_SHARED_LIBS=OFF", "-DYAML_CPP_INSTALL=ON"]
