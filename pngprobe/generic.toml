version = "0.1.0"
deps = ["libpng", "fribidi"]

# No source.toml: this package writes its own source. It exists to prove that
# dependencies are discovered when each one lives in its own directory — libpng
# through pkg-config, fribidi through pkg-config, and both by the linker.
#
# $CC, $CFLAGS, $CPPFLAGS, $LDFLAGS and $PKG_CONFIG_PATH come from the emitter
# and the system; nothing here spells out a path.
build = """
mkdir -p src
cat > src/main.c <<'EOF'
#include <stdio.h>
#include <png.h>
#include <fribidi.h>

int main(void) {
    unsigned int ver = png_access_version_number();
    printf("libpng %u (header %s)\\n", ver, PNG_LIBPNG_VER_STRING);
    printf("fribidi %d.%d.%d\\n", FRIBIDI_MAJOR_VERSION, FRIBIDI_MINOR_VERSION,
           FRIBIDI_MICRO_VERSION);
    if (ver < 10648u) {
        fprintf(stderr, "pngprobe: unexpected libpng version %u\\n", ver);
        return 1;
    }
    return 0;
}
EOF

# pkg-config resolves both dependencies out of their own directories.
"$CC" $CFLAGS $CPPFLAGS -o pngprobe src/main.c $LDFLAGS $(pkg-config --cflags --libs libpng fribidi)

# A native build may run what it just built; that is not emulation.
./pngprobe

mkdir -p "$PREFIX/bin"
cp pngprobe "$PREFIX/bin/"
"""
