version = "1.0.16"
deps = ["fribidi@source"]

# meson. Static library, header and .pc file. fribidi 1.0.16's meson build has
# three options — tests, docs and the command line tools — and all three are
# host-side, so they go off.
#
# No DESTDIR here: the emitter exports it for the whole build, and meson's
# --prefix is already the package's final directory, so `meson install` writes
# into the staging tree under the right path.
build = """
cp -r "$NESTDIR/fribidi@source"/. .
meson setup build $MESON_FLAGS -Dbuildtype=release -Ddefault_library=static -Dtests=false -Ddocs=false -Dbin=false
ninja -C build -j "$CORES"
ninja -C build install
"""
