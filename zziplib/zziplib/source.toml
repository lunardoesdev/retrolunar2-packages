version = "0.13.78"

build = """
mkdir -p dl
if [ ! -f dl/zziplib.tar.xz ]; then
  curl -fSL -C - -o dl/zziplib.tar.xz \"https://deb.debian.org/debian/pool/main/z/zziplib/zziplib_0.13.78+dfsg.1.orig.tar.xz\"
fi
rm -rf src
mkdir -p src
tar -xJf dl/zziplib.tar.xz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
