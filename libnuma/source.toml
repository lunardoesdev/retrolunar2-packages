version = "2.0.19"

build = """
mkdir -p dl
if [ ! -f dl/numactl.tar.gz ]; then
  curl -fSL -C - -o dl/numactl.tar.gz \"https://github.com/numactl/numactl/releases/download/v2.0.19/numactl-2.0.19.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/numactl.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
