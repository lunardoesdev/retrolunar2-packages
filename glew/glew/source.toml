version = "2.3.1"

build = """
mkdir -p dl
if [ ! -f dl/glew.tgz ]; then
  curl -fSL -C - -o dl/glew.tgz \"https://github.com/nigels-com/glew/releases/download/glew-2.3.1/glew-2.3.1.tgz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/glew.tgz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
