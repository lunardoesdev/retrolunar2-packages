version = "0.12.0"

build = """
mkdir -p dl
if [ ! -f dl/range-v3.tar.gz ]; then
  curl -fSL -C - -o dl/range-v3.tar.gz \"https://github.com/ericniebler/range-v3/archive/refs/tags/0.12.0.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/range-v3.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
