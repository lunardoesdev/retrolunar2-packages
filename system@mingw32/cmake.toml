# A recipe says `buildsystem = "cmake"` and gives only what is its own:
#   args        extra arguments, after the system's flags
#   source_dir  where CMakeLists.txt lives, when not the top of the work dir
[buildsystem.cmake]
CMAKE_GENERATOR = "Ninja"
CMAKE_TOOLCHAIN_FILE = "$SYSDIR/i686-w64-mingw32-toolchain.cmake"
CMAKE_FLAGS = "-DCMAKE_INSTALL_PREFIX=$OUTPKG -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_MAKE_PROGRAM=$CMAKE_MAKE_PROGRAM "
# cmake's compiler check links a test program and then runs it. A
# cross target binary cannot run here, and running one would be
# emulation, which we never do: link a static library instead.
# cmake 4.x refuses any project whose minimum policy is below 3.5,
# and most of these projects are older than cmake itself.
# cmake picks the make program out of $PREFIX, where bin/make is a
# target binary that would need an emulator to run. Pin the host's.
CMAKE_MAKE_PROGRAM = "$(command -v make || true)"
script = """
cmake -S \"${BS_source_dir:-.}\" -B build -G \"$CMAKE_GENERATOR\" ${CMAKE_TOOLCHAIN_FILE:+-DCMAKE_TOOLCHAIN_FILE=\"$CMAKE_TOOLCHAIN_FILE\"} $CMAKE_FLAGS $BS_args
cmake --build build --parallel \"$CORES\"
cmake --install build
"""
