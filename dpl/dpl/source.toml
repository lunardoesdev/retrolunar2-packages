version = "2022.14.0"

build = """
mkdir -p dl
if [ ! -f dl/oneDPL.tar.gz ]; then
  curl -fSL -C - -o dl/oneDPL.tar.gz \"https://github.com/oneapi-src/oneDPL/archive/refs/tags/oneDPL-release-2022.14.0.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/oneDPL.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
