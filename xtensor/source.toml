version = "0.27.1"

build = """
mkdir -p dl
if [ ! -f dl/xtensor.tar.gz ]; then
  curl -fSL -C - -o dl/xtensor.tar.gz \"https://github.com/xtensor-stack/xtensor/archive/refs/tags/0.27.1.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/xtensor.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
