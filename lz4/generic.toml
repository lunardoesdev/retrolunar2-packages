deps = ["lz4@source"]
buildsystem = "make"
make = false
install = false
post = """
# The lib/ Makefile honours PREFIX and BUILD_SHARED/LIBDIR, which is
# how lz4 expects to be installed into a staged prefix.
make -C lib PREFIX=\"$OUTPKG\" BUILD_SHARED=no BUILD_STATIC=yes
make -C lib PREFIX=\"$OUTPKG\" BUILD_SHARED=no BUILD_STATIC=yes install
make -C programs PREFIX=\"$OUTPKG\"
make -C programs PREFIX=\"$OUTPKG\" install
"""
