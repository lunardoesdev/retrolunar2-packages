version = "5.44.0"

build = """
mkdir -p dl
if [ ! -f dl/perl.tar.gz ]; then
  curl -fSL -C - -o dl/perl.tar.gz \"https://www.cpan.org/src/5.0/perl-5.44.0.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/perl.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/. $PREFIX/
# The CPAN tarball ships its files read-only (tar -tvzf shows -r--r--r--), and
# cp keeps the mode, so a published tree would be read-only too. perl's own
# Configure re-copies these files into its work directory and dies with
# "Permission denied" on the first one, so the tree has to be writable.
chmod -R u+w "$PREFIX"
"""
