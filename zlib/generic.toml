version = "1.3.1"
deps = ["zlib@source"]

# cmake, one job at a time unless the caller asked for more. The examples are
# off because they are executables nobody here runs.
build = """
cp -r "$NESTDIR/zlib@source"/. .
cmake -S . -B build $CMAKE_FLAGS -DZLIB_BUILD_EXAMPLES=OFF
cmake --build build --parallel "$CORES"
cmake --install build
"""

