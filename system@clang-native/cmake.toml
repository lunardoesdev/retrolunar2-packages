# A recipe says `buildsystem = "cmake"` and gives only what is its own:
#   args        extra arguments, after the system's flags
#   source_dir  where CMakeLists.txt lives, when not the top of the work dir
[buildsystem.cmake]
CMAKE_TOOLCHAIN_FILE = ""
CMAKE_FLAGS = "-DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
script = """
cmake -S \"${BS_source_dir:-.}\" -B build ${CMAKE_GENERATOR:+-G \"$CMAKE_GENERATOR\"} ${CMAKE_TOOLCHAIN_FILE:+-DCMAKE_TOOLCHAIN_FILE=\"$CMAKE_TOOLCHAIN_FILE\"} $CMAKE_FLAGS $BS_args
cmake --build build --parallel \"$CORES\"
cmake --install build
"""
