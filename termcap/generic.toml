deps = ["termcap@source"]
buildsystem = "autoconf"
# termcap 1.3.1 predates prototypes: needs pre-C23 (NDK clang
# defaults to C23 where implicit declarations are errors).
configure_args = ["--disable-shared", "--enable-static"]
pre = """
export CC=\"$CC -std=gnu89\"
"""
post = """
# No upstream .pc ships: write one so readline's
# Requires.private: termcap resolves via pkg-config.
mkdir -p $PREFIX/lib/pkgconfig
printf 'prefix=%s\\nexec_prefix=${prefix}\\nlibdir=${exec_prefix}/lib\\nincludedir=${prefix}/include\\nName: termcap\\nDescription: GNU termcap\\nVersion: 1.3.1\\nLibs: -L${libdir} -ltermcap\\nCflags: -I${includedir}\\n' \"$PREFIX\" > $PREFIX/lib/pkgconfig/termcap.pc
"""
