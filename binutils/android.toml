deps = ["zlib", "binutils@source"]

build = """
cp -r $NESTDIR/binutils@source/* .
# Android lacks pthread cancellation APIs used by gprofng.
./configure $AUTOCONF_CONFIGURE_FLAGS \\
    --enable-ld=default \\
    --enable-plugins \\
    --enable-shared \\
    --disable-werror \\
    --enable-64-bit-bfd \\
    --enable-new-dtags \\
    --with-system-zlib \\
    --disable-gprofng \\
    --enable-default-hash-style=gnu
touch aclocal.m4 configure config.h.in
find . -name 'Makefile.in' | xargs touch
make -j\"$CORES\" tooldir=\"$OUTPKG\"
make -j\"$CORES\" tooldir=\"$OUTPKG\" install
"""
