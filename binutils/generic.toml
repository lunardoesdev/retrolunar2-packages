deps = ["zlib", "binutils@source"]
buildsystem = "autoconf"
# Use the staged Zlib package and build the default BFD linker.
make = false
install = false
configure_args = ["--enable-ld=default", "--enable-plugins", "--enable-shared", "--disable-werror", "--enable-64-bit-bfd", "--enable-new-dtags", "--with-system-zlib", "--enable-default-hash-style=gnu"]
post = """
make -j\"$CORES\" tooldir=\"$PREFIX\"
make -j\"$CORES\" tooldir=\"$PREFIX\" install
"""
