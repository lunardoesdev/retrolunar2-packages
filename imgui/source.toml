version = "1.92.9"

build = """
mkdir -p dl
if [ ! -f dl/imgui.tar.gz ]; then
  curl -fSL -C - -o dl/imgui.tar.gz \"https://github.com/ocornut/imgui/archive/refs/tags/v1.92.9.tar.gz\"
fi
rm -rf src
mkdir -p src
tar -xzf dl/imgui.tar.gz -C src --strip-components=1
mkdir -p $PREFIX
cp -r src/* $PREFIX/
"""
