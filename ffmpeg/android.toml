deps = ["zlib", "bzip2", "xz", "opus", "libvpx", "lame", "ffmpeg@source"]
buildsystem = "autoconf"
# Cross builds must be told the host: ffmpeg would otherwise assume
# the build machine, and Bionic needs -DANDROID, which this system's
# $CFLAGS already carries (ffmpeg ignores $CFLAGS on its own).
configure_args = ["--prefix=$OUTPKG", "--enable-cross-compile", "--arch=$ffmpeg_arch", "--target-os=$HOST_OS", "--cc=$CC", "--cxx=$CXX", "--ar=$AR", "--ranlib=$RANLIB", "--strip=$STRIP", "--pkg-config-flags=--static", "--enable-static", "--disable-shared", "--disable-doc", "--disable-programs", "--disable-network", "--disable-iconv", "--disable-libxcb", "--enable-zlib", "--enable-bzlib", "--enable-lzma", "--enable-libopus", "--enable-libvpx", "--enable-libmp3lame", "--enable-pic", "--extra-cflags=$CFLAGS", "--extra-ldflags=$LDFLAGS"]
pre = """
case \"$HOST_ARCH\" in
    armv7a) ffmpeg_arch=arm ;;
    i686) ffmpeg_arch=x86 ;;
    *) ffmpeg_arch=\"$HOST_ARCH\" ;;
esac
"""
