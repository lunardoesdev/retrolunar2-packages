deps = ["zlib", "bzip2", "xz", "opus", "libvpx", "lame", "ffmpeg@source"]
buildsystem = "autoconf"
# Cross builds must be told the host: ffmpeg would otherwise assume
# the build machine, and Bionic needs -DANDROID, which this system's
# $CFLAGS already carries (ffmpeg ignores $CFLAGS on its own).
configure_args = ["--prefix=$OUTPKG", "--enable-cross-compile", "--target-os=$HOST_OS", "--cc=$CC", "--cxx=$CXX", "--ar=$AR", "--ranlib=$RANLIB", "--strip=$STRIP", "--pkg-config-flags=--static", "--enable-static", "--disable-shared", "--disable-doc", "--disable-programs", "--disable-network", "--disable-iconv", "--disable-libxcb", "--enable-zlib", "--enable-bzlib", "--enable-lzma", "--enable-libopus", "--enable-libvpx", "--enable-libmp3lame", "--enable-pic"]
pre = """
case \"$HOST_ARCH\" in
    armv7a) ffmpeg_arch=arm ;;
    i686) ffmpeg_arch=x86 ;;
    *) ffmpeg_arch=\"$HOST_ARCH\" ;;
esac

# The driver emits a recipe's fields *before* the recipe's own shell, so
# --arch=$ffmpeg_arch written among the arguments above was expanded before this
# case had run, which set -u reports as an unbound name:
#   sh: line NN: ffmpeg_arch: unbound variable
# (BS_configure_args is assigned with --arch=$ffmpeg_arch... a few lines above
# the case; libvpx's --target=$vpx_arch has the same shape). The arch joins the
# arguments here instead, where the name exists, and ./configure below reads the
# variable after this point.
BS_configure_args=\"$BS_configure_args --arch=$ffmpeg_arch\"

# ffmpeg's configure is hand-written (libav family) and knows no --host/--build:
# the driver's $AUTOCONF_CONFIGURE_FLAGS carries both for the autotools
# packages, and ffmpeg stops at the first of them with
#   Unknown option \"--host=aarch64-linux-android\".
# See ./configure --help for available options.
# Cross builds here are the explicit pair --enable-cross-compile with
# --arch/--target-os, so the driver's flags are trimmed to the install prefix,
# which ffmpeg does take.
AUTOCONF_CONFIGURE_FLAGS=\"--prefix=$OUTPKG\"

# The driver expands a list field unquoted, so an element holding spaces reaches
# configure as several arguments and ffmpeg rejects the second word -
#   Unknown option \"-fPIC\".
# See ./configure --help for available options.
# (that was --extra-cflags=$CFLAGS: the system's CFLAGS is five words).
# --extra-cflags is one of the few options ffmpeg *appends* - its name sits in
# the parser's CMDLINE_APPEND list - so the flags are handed over one token at a
# time and add up to exactly what the system set.
#
# There is no equivalent for the linker: --extra-ldflags is advertised in
# ffmpeg's help, but the name appears nowhere in configure's CMDLINE_SET or
# CMDLINE_APPEND lists, so passing it is the same trap one word later. The
# linker flags are therefore left to ffmpeg's own target rules - a static-only
# build of ours links no program - and the dependencies are found through
# pkg-config, whose search path the closure sets (--pkg-config-flags=--static
# above). CFLAGS is what the build genuinely needs: -DANDROID and the NDK's
# header directory reach every compile through it.
for _f in $CFLAGS; do
  BS_configure_args=\"$BS_configure_args --extra-cflags=$_f\"
done
unset _f
"""

# The driver's fields are asserted rather than left to their defaults: the
# emitted script reads BS_make as ${BS_make:-} in every node's block, so a field
# this recipe does not define is whatever the node before it left behind. The
# node before this one is lame, which builds in post and sets make = false /
# install = false, so without the lines below ffmpeg had both steps skipped in
# silence: nothing was staged and the entry's relax step reported
#   sh: line 50: <stage>/.../store/<hash>/../.relax-list: No such file or directory
# targets, make_args and install_args are cleared for the same reason - the
# previous node's value would arrive as this one's arguments.
make = true
install = true
targets = ""
make_args = ""
install_args = ""
