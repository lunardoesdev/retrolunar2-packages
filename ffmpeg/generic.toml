deps = ["zlib", "bzip2", "xz", "opus", "libvpx", "lame", "ffmpeg@source"]
buildsystem = "autoconf"
# ffmpeg's configure is hand-written (libav-style) and ignores
# $CFLAGS/$LDFLAGS, so the system's flags go in explicitly.
# Cross targets need --arch/--target-os and cannot guess the target;
# they are served by android.lua (and any other family file), which
# reads $HOST_ARCH/$HOST_OS from the system.
configure_args = ["--prefix=$OUTPKG", "--cc=$CC", "--cxx=$CXX", "--ar=$AR", "--ranlib=$RANLIB", "--strip=$STRIP", "--pkg-config-flags=--static", "--enable-static", "--disable-shared", "--disable-doc", "--disable-programs", "--disable-network", "--disable-iconv", "--disable-libxcb", "--enable-zlib", "--enable-bzlib", "--enable-lzma", "--enable-libopus", "--enable-libvpx", "--enable-libmp3lame", "--enable-pic", "--extra-cflags=$CFLAGS", "--extra-ldflags=$LDFLAGS"]
